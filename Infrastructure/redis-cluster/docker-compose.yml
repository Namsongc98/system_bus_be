      --cluster-node-timeout 5000
      --appendonly yes
      --bind 0.0.0.0
      --protected-mode no
      --cluster-announce-ip 172.30.0.14
      --cluster-announce-port 7004
      --cluster-announce-bus-port 17004
    networks:
      redis-cluster-net:
        ipv4_address: 172.30.0.14

  # như redis-node-1 — khác: container redis-5, cổng 7005/17005, IP 172.30.0.15, ./data/node-5
  redis-node-5:
    image: redis:7-alpine
    container_name: redis-5
    restart: always
    ports:
      - "7005:7005"
      - "17005:17005"
    volumes:
      - ./data/node-5:/data
    command: >
      redis-server
      --port 7005
      --cluster-enabled yes
      --cluster-config-file nodes.conf
      --cluster-node-timeout 5000
      --appendonly yes
      --bind 0.0.0.0
      --protected-mode no
      --cluster-announce-ip 172.30.0.15
