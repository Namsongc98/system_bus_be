# App layer: 2 Spring Boot service hien co.
# Khong doi container_name: phai khop target trong ../kong/kong.yml
# (booking-container:8081, manage-revenue-ticket:8082).
# Ca 2 service phai join CA BA network (tach rieng trong setup hien tai):
# ticket-system-network (MySQL, Kong), redis-cluster-net (Redis cluster),
# kafka_kafka-net (broker1-3, tao boi ../kafka/docker-compose.yml, project "kafka").
services:
  booking-service:
    build:
      context: ../../
      dockerfile: booking_ticket/Dockerfile
    image: ghcr.io/${GITHUB_REPOSITORY_OWNER:-changeme}/ticket-system-booking_ticket:latest
    container_name: booking-container
    restart: unless-stopped
    env_file:
      - ../../.env
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql-ticket-system:3306/quan-ly-ban-hang
      SPRING_KAFKA_BOOTSTRAP_SERVERS: broker1:29092,broker2:29092,broker3:29092
      # RedisConfig (common-library) đọc spring.redis.cluster.nodes, không phải spring.data.redis.*
      SPRING_REDIS_CLUSTER_NODES: redis-1:7001,redis-2:7002,redis-3:7003,redis-4:7004,redis-5:7005,redis-6:7006
      # Trong container: dùng thẳng IP 172.x mà cluster announce, không đổi sang 127.0.0.1
      APP_REDIS_MAP_DOCKER_IPS_TO_LOCALHOST: "false"
    networks:
      - ticket-system-network
      - redis-cluster-net
      - kafka-net

  manage-revenue-ticket:
    build:
      context: ../../
      dockerfile: manage-revenue-ticket/Dockerfile
    image: ghcr.io/${GITHUB_REPOSITORY_OWNER:-changeme}/ticket-system-manage-revenue-ticket:latest
    container_name: manage-revenue-ticket
    restart: unless-stopped
    env_file:
      - ../../.env
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql-ticket-system:3306/quan-ly-ban-hang
      SPRING_KAFKA_BOOTSTRAP_SERVERS: broker1:29092,broker2:29092,broker3:29092
      # RedisConfig (common-library) đọc spring.redis.cluster.nodes, không phải spring.data.redis.*
      SPRING_REDIS_CLUSTER_NODES: redis-1:7001,redis-2:7002,redis-3:7003,redis-4:7004,redis-5:7005,redis-6:7006
      # Trong container: dùng thẳng IP 172.x mà cluster announce, không đổi sang 127.0.0.1
      APP_REDIS_MAP_DOCKER_IPS_TO_LOCALHOST: "false"
    networks:
      - ticket-system-network
      - redis-cluster-net
      - kafka-net

networks:
  ticket-system-network:
    external: true
  redis-cluster-net:
    external: true
    name: redis-cluster-net
  kafka-net:
    external: true
    name: kafka_kafka-net
