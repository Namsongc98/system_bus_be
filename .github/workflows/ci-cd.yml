name: CI-CD

on:
  push:
    branches: [main]
    paths:
      - 'booking_ticket/**'
      - 'manage-revenue-ticket/**'
      - 'common-library/**'
      - 'pom.xml'

permissions:
  contents: read
  packages: write

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21' }
      - run: mvn -B clean test

  build-push:
    needs: build-test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [booking_ticket, manage-revenue-ticket]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.service }}/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/ticket-system-${{ matrix.service }}:latest

  deploy-vm1:
    needs: build-push
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VM1_HOST }}
          username: ${{ secrets.VM1_USER }}
          key: ${{ secrets.VM1_SSH_KEY }}
          script: |
            cd ~/System_bus/ticket-system/Infrastructure
            docker compose -f app/docker-compose.yml -f docker-compose.prod.override.yml pull booking-service manage-revenue-ticket
            docker compose \
              -f mysql/docker-compose.yml \
              -f kafka/docker-compose.yml \
              -f kong/docker-compose.yml \
              -f redis-cluster/docker-compose.yml \
              -f app/docker-compose.yml \
              -f tls/docker-compose.yml \
              -f docker-compose.prod.override.yml \
              up -d
