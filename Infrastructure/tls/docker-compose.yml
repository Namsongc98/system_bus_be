# NGINX o day CHI lam TLS termination truoc Kong - khong route/rate-limit,
# Kong (../kong) da lam viec do roi. Tranh 2 lop proxy trung chuc nang.
# Kong nam trong compose file rieng (../kong/docker-compose.yml) nhung cung
# ticket-system-network nen NGINX goi duoc qua ten service "kong".
# Thu tu start: kong PHAI len truoc nginx (xem DEPLOYMENT.md), khong dung
# depends_on vi khac compose file.
#
# Luồng prod: Internet :443 (HTTPS) → tls-proxy (giải mã) → http://kong:8000 → BE (../app).
# Chỉ dùng trên VM production có tên miền; dev local không cần file này (FE gọi thẳng Kong :8000).
services:
  nginx:
    image: nginx:1.27-alpine
    container_name: tls-proxy
    restart: unless-stopped
    ports:
      - "80:80"                          # HTTP: chỉ để Let's Encrypt xác thực + chuyển hướng sang HTTPS
      - "443:443"                        # HTTPS công khai
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro   # cấu hình server 80/443 (proxy_pass tới kong:8000)
      - ./certbot/conf:/etc/letsencrypt:ro               # chứng chỉ do certbot tạo (dùng chung thư mục với service certbot)
      - ./certbot/www:/var/www/certbot:ro                # file thử thách ACME certbot ghi ra, nginx phục vụ ở /.well-known/
    networks:
      - ticket-system-network            # chung mạng với Kong → proxy_pass http://kong:8000 (tên service làm alias DNS)

  certbot:                               # công cụ xin/gia hạn chứng chỉ Let's Encrypt
    image: certbot/certbot
    container_name: certbot
    volumes:
      - ./certbot/conf:/etc/letsencrypt  # ghi chứng chỉ (nginx đọc cùng thư mục, :ro)
      - ./certbot/www:/var/www/certbot   # ghi file thử thách ACME
    entrypoint: "true"   # container nay khong tu chay gi ca, chi dung de goi 'docker compose run certbot ...'
                         # vd: docker compose run --rm certbot certonly --webroot -w /var/www/certbot -d <domain>

networks:
  ticket-system-network:
    external: true                       # tạo sẵn bằng docker network create (chung mysql, kong, app)
