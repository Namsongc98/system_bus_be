      --cluster-announce-bus-port 17005
    networks:
      redis-cluster-net:
        ipv4_address: 172.30.0.15

  # như redis-node-1 — khác: container redis-6, cổng 7006/17006, IP 172.30.0.16, ./data/node-6
  redis-node-6:
    image: redis:7-alpine
    container_name: redis-6
    restart: always
    ports:
      - "7006:7006"
      - "17006:17006"
    volumes:
      - ./data/node-6:/data
    command: >
      redis-server
      --port 7006
      --cluster-enabled yes
      --cluster-config-file nodes.conf
      --cluster-node-timeout 5000
      --appendonly yes
      --bind 0.0.0.0
      --protected-mode no
      --cluster-announce-ip 172.30.0.16
      --cluster-announce-port 7006
      --cluster-announce-bus-port 17006
    networks:
      redis-cluster-net:
        ipv4_address: 172.30.0.16

networks:
  redis-cluster-net:                     # file này TẠO mạng (không external); ../app join với external: true
    name: redis-cluster-net              # đặt tên cố định, không có tiền tố project (khác kafka_kafka-net)
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.0.0/16          # chứa 6 IP cố định 172.30.0.11–16; CLAUDE.md dùng cùng subnet
        # Lưu ý (B29): nếu mạng đã tạo tay bằng `docker network create` (CLAUDE.md), Compose có thể
        # báo mạng thiếu nhãn project — xoá mạng tạo tay hoặc đổi sang external: true.