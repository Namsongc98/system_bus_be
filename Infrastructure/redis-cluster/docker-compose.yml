      --protected-mode no
      --cluster-announce-ip 172.30.0.13
      --cluster-announce-port 7003
      --cluster-announce-bus-port 17003
    networks:
      redis-cluster-net:
        ipv4_address: 172.30.0.13

  # như redis-node-1 — khác: container redis-4, cổng 7004/17004, IP 172.30.0.14, ./data/node-4
  redis-node-4:
    image: redis:7-alpine
    container_name: redis-4
    restart: always
    ports:
      - "7004:7004"
      - "17004:17004"
    volumes:
      - ./data/node-4:/data
    command: >
      redis-server
      --port 7004
      --cluster-enabled yes
