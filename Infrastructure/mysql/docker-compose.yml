services:
  mysql:
    image: mysql:8.0
    container_name: mysql-ticket-system
    environment:
      MYSQL_ROOT_PASSWORD: 123456789
      MYSQL_DATABASE: quan-ly-ban-hang
    ports:
      - "3306:3306"
    networks:
      - ticket-system-network

networks:
  ticket-system-network:
    external: true # Khai báo đây là network bên ngoài, không tự tạo mới
