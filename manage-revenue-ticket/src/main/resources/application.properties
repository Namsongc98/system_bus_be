spring.application.name=manage-revenue-ticket
server.port=8082
logging.level.org.springframework.security=DEBUG

jwt.secret=${JWT_SECRET}
# config Hibernate (JPA)
# MySQL
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:validate}
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# Flyway is the schema owner; Hibernate only validates.
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# MySQL
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/quan-ly-ban-hang?allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.kafka.bootstrap-servers=localhost:9092,localhost:9093,localhost:9094
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.listener.concurrency=3
auto.create.topics.enable=false
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=*

#email
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# C?u h\uFFFDnh danh s\uFFFDch c\uFFFDc node trong Cluster
spring.data.redis.timeout=6000

spring.data.redis.lettuce.cluster.refresh.adaptive=true
spring.data.redis.lettuce.cluster.refresh.period=30s

spring.redis.cluster.nodes=172.30.0.11:7001,172.30.0.12:7002,172.30.0.13:7003,172.30.0.14:7004,172.30.0.15:7005,172.30.0.16:7006

# C?u h\uFFFDnh Cache v\uFFFD Session (Gi? nguy\uFFFDn ho?c t\uFFFDy ch?nh)
spring.cache.type=redis
spring.session.store-type=redis
spring.session.timeout=30m


# T\uFFFDy ch?n: C?u h\uFFFDnh th\uFFFDm cho Redis Client (Lettuce) ?? t? ??ng l\uFFFDm m?i s? ?? c?m

minio.url=${MINIO_URL:http://localhost:9000}
minio.access-key=${MINIO_ACCESS_KEY:}
minio.secret-key=${MINIO_SECRET_KEY:}
minio.bucket=${MINIO_BUCKET:user-avatars}

spring.web.resources.static-locations: file:uploads/
