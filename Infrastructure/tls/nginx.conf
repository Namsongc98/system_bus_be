# TLS termination trước Kong (xem docker-compose.yml cùng thư mục). Chỉ dùng trên VM production.
# `your-domain.com` là placeholder — thay bằng tên miền thật (3 chỗ) trước khi xin chứng chỉ.

# Cổng 80: phục vụ thử thách Let's Encrypt, mọi request khác chuyển sang HTTPS
server {
    listen 80;
    server_name your-domain.com;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }   # file certbot ghi ra (volume ./certbot/www)
    location / { return 301 https://$host$request_uri; }               # ép dùng HTTPS
}

# Cổng 443: giải mã TLS rồi chuyển nguyên request sang Kong (HTTP trong mạng Docker)
server {
    listen 443 ssl;
    server_name your-domain.com;
    ssl_certificate /etc/letsencrypt/live/your-domain.com/fullchain.pem;     # chứng chỉ do certbot tạo (volume ./certbot/conf)
    ssl_certificate_key /etc/letsencrypt/live/your-domain.com/privkey.pem;

    location / {
        proxy_pass http://kong:8000;                                 # "kong" = tên service trong ../kong/docker-compose.yml, cùng ticket-system-network
        proxy_set_header Host $host;                                 # giữ tên miền gốc cho Kong/BE
        # IP client thật. Lưu ý (B29): Kong chỉ dùng header này khi có KONG_TRUSTED_IPS + KONG_REAL_IP_HEADER;
        # hiện chưa cấu hình → rate-limiting (limit_by: ip) trong kong.yml tính theo IP của container nginx
        # (mọi người dùng chung 1 hạn mức).
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Khop voi write_timeout/read_timeout: 60000 da khai bao trong ../kong/kong.yml
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }
}
