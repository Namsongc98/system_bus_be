# Redis Cluster 6 node (3 master + 3 replica) — cache, session, giữ ghế của 2 service Spring.
# Chạy: docker compose up -d   (trong thư mục này), rồi tạo cluster 1 lần — xem CLAUDE.md:
#   docker exec -it redis-1 redis-cli --cluster create 172.30.0.11:7001 … 172.30.0.16:7006 --cluster-replicas 1
# Ai kết nối tới đây (RedisConfig trong common-library đọc spring.redis.cluster.nodes):
#   - BE trong container (../app): redis-1:7001…redis-6:7006 qua mạng redis-cluster-net, dùng thẳng IP 172.30.x
#   - BE trong IntelliJ / mvn:     172.30.0.11:7001… trong application.properties; RedisConfig đổi 172.x → 127.0.0.1
#                                  (app.redis.map-docker-ips-to-localhost=true) và đi qua cổng publish 7001–7006
services:
  redis-node-1:                          # tên service (dùng trong ../docker-compose.prod.override.yml)
    image: redis:7-alpine
    container_name: redis-1              # tên container = hostname trên redis-cluster-net (seed node của ../app)
    restart: always                      # tự chạy lại cả khi đã stop tay rồi Docker khởi động lại
    ports:
      - "7001:7001"                      # cổng client — IntelliJ vào qua localhost:7001
      - "17001:17001"                    # cổng bus cluster (= cổng client + 10000): node ↔ node trao đổi trạng thái
    volumes:
      - ./data/node-1:/data              # dữ liệu runtime (nodes.conf, AOF) — không sửa tay, không commit
    # Tham số redis-server (comment không đặt được bên trong khối `>` bên dưới):
    #   --port 7001                      cổng client, khớp `ports`
    #   --cluster-enabled yes            chạy ở chế độ cluster (chia 16384 slot cho 3 master)
    #   --cluster-config-file nodes.conf Redis tự ghi sơ đồ cluster vào /data/nodes.conf
    #   --cluster-node-timeout 5000      5s không phản hồi → coi node chết, replica lên thay
    #   --appendonly yes                 ghi AOF → dữ liệu còn sau restart
    #   --bind 0.0.0.0 --protected-mode no  nhận kết nối từ mạng Docker/host, không mật khẩu (chỉ dùng dev)
    #   --cluster-announce-ip 172.30.0.11   IP node tự giới thiệu cho client khi redirect (MOVED/ASK);
    #                                       phải = ipv4_address bên dưới
    #   --cluster-announce-port / -bus-port cổng giới thiệu kèm IP trên
    command: >
      redis-server
      --port 7001
      --cluster-enabled yes
      --cluster-config-file nodes.conf
      --cluster-node-timeout 5000
      --appendonly yes
      --bind 0.0.0.0
      --protected-mode no
      --cluster-announce-ip 172.30.0.11
      --cluster-announce-port 7001
      --cluster-announce-bus-port 17001
    networks:
      redis-cluster-net:
        ipv4_address: 172.30.0.11        # IP cố định trong subnet 172.30.0.0/16 — cluster lưu IP, đổi IP là hỏng cluster

  # như redis-node-1 — khác: container redis-2, cổng 7002/17002, IP 172.30.0.12, ./data/node-2
  redis-node-2:
    image: redis:7-alpine
    container_name: redis-2
    restart: always
    ports:
      - "7002:7002"
      - "17002:17002"
    volumes:
      - ./data/node-2:/data
    command: >
      redis-server
      --port 7002
      --cluster-enabled yes
      --cluster-config-file nodes.conf
      --cluster-node-timeout 5000
      --appendonly yes
      --bind 0.0.0.0
      --protected-mode no
      --cluster-announce-ip 172.30.0.12
      --cluster-announce-port 7002
      --cluster-announce-bus-port 17002
    networks:
      redis-cluster-net:
        ipv4_address: 172.30.0.12

  # như redis-node-1 — khác: container redis-3, cổng 7003/17003, IP 172.30.0.13, ./data/node-3
  redis-node-3:
    image: redis:7-alpine
    container_name: redis-3
    restart: always
    ports:
      - "7003:7003"
      - "17003:17003"
    volumes:
      - ./data/node-3:/data
    command: >
